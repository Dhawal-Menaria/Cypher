<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cypher - Tactical AI Engine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#766000",
                        "on-secondary-fixed-variant": "#004c6e",
                        "background": "#0c150f",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#29332b",
                        "surface-container-low": "#141e17",
                        "secondary-fixed-dim": "#89ceff",
                        "surface-container-high": "#232c25",
                        "primary-fixed": "#56ffa8",
                        "secondary-fixed": "#c9e6ff",
                        "secondary-container": "#00a2e6",
                        "primary-fixed-dim": "#00e38b",
                        "on-tertiary-fixed-variant": "#554500",
                        "error": "#ffb4ab",
                        "on-tertiary": "#3b2f00",
                        "on-background": "#dae5da",
                        "on-secondary-fixed": "#001e2f",
                        "on-primary-fixed-variant": "#00522f",
                        "surface-variant": "#2d3730",
                        "outline-variant": "#3b4a3f",
                        "surface-container-lowest": "#07100a",
                        "primary": "#f4fff3",
                        "error-container": "#93000a",
                        "surface-bright": "#323c34",
                        "tertiary-fixed": "#ffe17a",
                        "primary-container": "#00ff9d",
                        "surface-tint": "#00e38b",
                        "on-secondary-container": "#00344e",
                        "tertiary": "#fffaff",
                        "on-tertiary-fixed": "#231b00",
                        "inverse-surface": "#dae5da",
                        "on-surface": "#dae5da",
                        "surface-container-highest": "#2d3730",
                        "surface-container": "#18221b",
                        "surface": "#0c150f",
                        "on-secondary": "#00344d",
                        "tertiary-fixed-dim": "#e4c44f",
                        "inverse-primary": "#006d40",
                        "on-primary-fixed": "#002110",
                        "on-surface-variant": "#b9cbbc",
                        "secondary": "#89ceff",
                        "surface-dim": "#0c150f",
                        "tertiary-container": "#ffdd65",
                        "outline": "#849587",
                        "on-primary-container": "#007143",
                        "on-error": "#690005",
                        "on-primary": "#00391f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "stack-md": "16px",
                        "margin-mobile": "16px",
                        "stack-lg": "32px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "stack-xs": "4px",
                        "stack-sm": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "code-sm": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "status-lg": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "code-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "status-lg": ["18px", { "lineHeight": "1.2", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .grid-bg {
            background-size: 24px 24px;
            background-image: 
                linear-gradient(to right, rgba(59, 74, 63, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 74, 63, 0.1) 1px, transparent 1px);
        }
        .blinking-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-surface grid-bg min-h-screen flex flex-col font-body-base text-body-base">



<!-- TopNavBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant docked full-width h-[56px] flat no shadows">
<div class="flex items-center gap-stack-md">
<div class="flex items-center gap-stack-sm">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse shadow-[0_0_4px_#00ff9d]"></span>
<span class="font-label-caps text-headline-md font-bold text-primary-container dark:text-primary-container">CYPHER</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">AI SECURITY INTEL</span>
</div>
<div class="flex items-center gap-stack-md">
<div class="flex items-center gap-stack-sm border border-outline-variant rounded px-2 py-1 bg-surface-container-low">
<span class="w-1.5 h-1.5 rounded-full bg-error animate-pulse"></span>
<span class="font-label-caps text-[10px] text-error font-bold tracking-wider">LIVE</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block border border-outline-variant rounded px-2 py-1">Gemini POWERED</span>
<button class="text-primary-container hover:text-primary-container transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">sensors</span>
</button>
</div>
</header>

{% block body %}{% endblock body %}


<!-- Footer -->
<footer class="w-full py-stack-lg flex flex-col items-center justify-center gap-stack-sm bg-background dark:bg-background border-t border-outline-variant dark:border-outline-variant full-width bottom-0 flat no shadows">
<p class="font-code-sm text-code-sm text-outline dark:text-outline text-center">CYPHER © 2025 · Built with Django + OpenAI · Not a hacking tool</p>
<div class="flex gap-stack-md font-code-sm text-code-sm text-outline">
<a class="hover:text-on-surface transition-colors" href="#">Stack Status</a>
<span class="text-outline-variant">•</span>
<a class="hover:text-on-surface transition-colors" href="#">Security Protocol</a>
<span class="text-outline-variant">•</span>
<a class="hover:text-on-surface transition-colors" href="#">Access Logs</a>
</div>
</footer>


</body>
</html>
